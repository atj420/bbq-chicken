<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBQ Chicken</title>
    <!-- CSS 파일 연결 (같은 폴더) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">
        <!-- 왼쪽 메뉴바 -->
        <nav class="side-nav">
            <h1>BBQ<br><span>CHICKEN</span></h1>
            <ul class="menu-list">
                <li><a href="#">황금올리브</a></li>
                <li><a href="#">자메이카 통다리</a></li>
                <li><a href="#">매장 찾기</a></li>
                <li><a href="#">온라인 주문</a></li>
            </ul>
        </nav>

        <!-- 오른쪽 메인 화면 -->
        <main class="main-content">
            <div class="banner">
                <h2>세상에서 가장 바삭한 치킨</h2>
                <p>황금올리브 치킨의 세계로 초대합니다.</p>
            </div>

            <!-- 사진과 메뉴가 들어가는 반응형 박스들 -->
            <div class="grid-container">
                <div class="box">
                    <img src="https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?w=500&q=80" alt="임시치킨">
                    <h3>황금올리브 치킨</h3>
                </div>
                <div class="box">
                    <img src="https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=500&q=80" alt="임시치킨2">
                    <h3>양념 치킨</h3>
                </div>
                <div class="box">
                    <img src="https://images.unsplash.com/photo-1569058242253-92a9c755a0ec?w=500&q=80" alt="임시치킨3">
                    <h3>자메이카 통다리</h3>
                </div>
                <div class="box">
                    <img src="https://images.unsplash.com/photo-1589302168068-964664d93dc0?w=500&q=80" alt="임시치킨4">
                    <h3>치즈볼</h3>
                </div>
            </div>
        </main>
    </div>

    <!-- JS 파일 연결 (같은 폴더) -->
    <script src="custom.js"></script>
</body>
</html>
