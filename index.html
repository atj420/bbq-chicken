<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 뷰포트 설정 (step1. 준비작업 필수 구문) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBQ Chicken 250807</title>
    <!-- 구글 웹 폰트 및 웹 폰트 아이콘 연결 -->
    <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">
        <!-- 좌측/상단 메뉴 -->
        <header class="header">
            <h1 class="logo"><i class="fa-solid fa-drumstick-bite"></i><br>BBQ CHICKEN</h1>
            <ul class="menu">
                <li><a href="#">Menu</a></li>
                <li><a href="#">Event</a></li>
                <li><a href="#">Store</a></li>
                <li><a href="#">Order</a></li>
            </ul>
        </header>

        <!-- 우측 12개 콘텐츠 박스 영역 -->
        <main class="container">
            <!-- step2. 첫 번째 요소만 가로폭을 넓게 지정하기 위한 box1 -->
            <div class="box box1">
                <div class="txt">
                    <h2>A Whole New World</h2>
                    <p>세상에서 가장 바삭한 황금올리브 치킨의 세계</p>
                </div>
            </div>
            <div class="box box2"><h3>Golden Olive</h3></div>
            <div class="box box3"><h3>Jamaica</h3></div>
            <div class="box box4"><h3>Hot Wing</h3></div>
            <div class="box box5"><h3>Cheese Ball</h3></div>
            <div class="box box6"><h3>Rose Tteok</h3></div>
            <div class="box box7"><h3>Garlic</h3></div>
            <div class="box box8"><h3>Gangjeong</h3></div>
            <div class="box box9"><h3>Review</h3></div>
            <div class="box box10"><h3>Notice</h3></div>
            <div class="box box11"><h3>Event</h3></div>
            <div class="box box12"><h3>Order Now</h3></div>
        </main>
    </div>
    <script src="custom.js"></script>
</body>
</html>
