<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBQ Chicken Responsive</title>
    <!-- 구글 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
    <!-- css 폴더 안의 style.css 연결 -->
    <link rel="stylesheet" href="css/style.css">
    <!-- js 폴더 안의 prefixfree.min.js 연결 -->
    <script src="js/prefixfree.min.js"></script>
</head>
<body>
    <header id="header">
        <div class="logo">
            <!-- img 폴더 안의 logo.png 연결 -->
            <a href="#"><img src="img/logo.png" alt="BBQ 로고"></a>
        </div>
        <ul class="gnb">
            <li><a href="#">Menu</a></li>
            <li><a href="#">Facility</a></li>
            <li><a href="#">Business</a></li>
            <li><a href="#">Restaurant</a></li>
        </ul>
    </header>

    <div id="sub_bar">
        <span>Sign up for stylesheet</span>
        <span>English</span>
    </div>

    <main id="container">
        <!-- 1번: 황금올리브 -->
        <section class="box">
            <div class="inner_txt">
                <h1>Golden Olive</h1>
                <p>세상에서 가장 바삭한 황금올리브 치킨</p>
            </div>
        </section>
        <!-- 2번: 자메이카 통다리 -->
        <section class="box"><h2>자메이카 통다리</h2></section>
        <!-- 3번: 양념 치킨 -->
        <section class="box"><h2>양념 치킨</h2></section>
        <!-- 4번: 자메이카 소떡만나 -->
        <section class="box"><h2>자메이카 소떡만나</h2></section>
        <!-- 5번: 까망 오징어 먹물 -->
        <section class="box"><h2>까망 오징어 먹물</h2></section>

        <!-- 6~10번 박스 -->
        <section class="box"><h2>Hot Spot</h2></section>
        <section class="box"><h2>Special Event</h2></section>
        <section class="box"><h2>Store Finder</h2></section>
        <section class="box"><h2>Customer Review</h2></section>
        <section class="box"><h2>Order Now</h2></section>
        <section class="box"><h2>Notice</h2></section>
        <section class="box"><h2>Contact</h2></section>
    </main>
</body>
</html>
